name: Candidate v12 historical protected frame diagnostic

on:
  push:
    branches:
      - research/candidate-v12-fresh-lineage
    paths:
      - scripts/diagnose_candidate_v11_protected_frame_failures.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v12-fresh-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run diagnostic only (no formal evaluation)
        env:
          PYTHONPATH: src
        run: python scripts/diagnose_candidate_v11_protected_frame_failures.py
      - name: Persist diagnostic aggregate
        run: |
          if git diff --quiet -- results/candidate-v12/candidate-v11-protected-frame-failure-taxonomy.json; then
            echo "No diagnostic diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v12/candidate-v11-protected-frame-failure-taxonomy.json
          git commit -m "candidate-v12: record historical protected frame taxonomy [skip ci]"
          git push origin HEAD:research/candidate-v12-fresh-lineage
