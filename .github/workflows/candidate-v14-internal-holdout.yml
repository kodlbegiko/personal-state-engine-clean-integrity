name: Candidate-v14 Internal Holdout

on:
  push:
    branches:
      - research/candidate-v14-generalization-recovery
    paths:
      - results/candidate-v14/candidate-v14-freeze.json

jobs:
  one-shot-internal-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source and preregistered hashes
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          freeze = json.loads((root/'results/candidate-v14/candidate-v14-freeze.json').read_text())
          def sha(path):
              return hashlib.sha256((root/path).read_bytes()).hexdigest()
          checks = {
              'candidate_source_sha256': sha('src/personal_state_engine/candidate_v14.py'),
              'development_evaluator_sha256': sha('scripts/candidate_v14_development.py'),
              'selection_policy_sha256': sha('docs/research/candidate-v14/selection-policy.json'),
              'preregistration_sha256': sha('docs/research/candidate-v14/internal-holdout-preregistration.json'),
          }
          for key, actual in checks.items():
              expected = freeze[key]
              if actual != expected:
                  raise SystemExit(f'freeze hash mismatch: {key}: {actual} != {expected}')
          if (root/'results/candidate-v14/internal-holdout-results.json').exists():
              raise SystemExit('internal holdout result already exists; refusing second invocation')
          print(json.dumps(checks, indent=2))
          PY
      - name: Materialize deterministic frozen corpus
        env:
          PYTHONPATH: src
        run: python scripts/candidate_v14_development.py generate
      - name: Verify untouched holdout digest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          freeze=json.loads(Path('results/candidate-v14/candidate-v14-freeze.json').read_text())
          actual=hashlib.sha256(Path('data/candidate-v14-development/untouched-internal-holdout.json').read_bytes()).hexdigest()
          if actual != freeze['holdout_sha256']:
              raise SystemExit(f'holdout hash mismatch: {actual} != {freeze["holdout_sha256"]}')
          print(actual)
          PY
      - name: Execute one-shot internal holdout
        env:
          PYTHONPATH: src
        run: python scripts/candidate_v14_development.py holdout
      - name: Apply preregistered qualification gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/candidate-v14/internal-holdout-results.json').read_text())
          family_pass=all(v >= .75 for v in r['family_accuracy'].values())
          domain_pass=all(v['r1'] >= .65 and v['answerable_recall'] >= .80 and v['false_retrieval'] <= .18 for v in r['domain_metrics'].values())
          aggregate_pass=(r['mrr'] >= .85 and r['r1'] >= .80 and r['r3'] >= .90 and r['r5'] >= .93 and r['answerable_recall'] >= .92 and r['eligible_rank1_accuracy'] >= .82 and r['abstention_accuracy'] >= .88 and r['false_abstention'] <= .08 and r['false_retrieval'] <= .10)
          anti_collapse=(0.05 < r['retrieve_rate'] < .95 and 0.05 < r['abstain_rate'] < .95)
          audit={'aggregate_gates': 'PASS' if aggregate_pass else 'FAIL','family_gates':'PASS' if family_pass else 'FAIL','domain_gates':'PASS' if domain_pass else 'FAIL','anti_collapse':'PASS' if anti_collapse else 'FAIL','all_qualification_gates':'PASS' if aggregate_pass and family_pass and domain_pass and anti_collapse else 'FAIL'}
          Path('results/candidate-v14/internal-holdout-gate-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2))
          PY
      - name: Upload one-shot holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v14-internal-holdout-evidence
          path: |
            results/candidate-v14/internal-holdout-results.json
            results/candidate-v14/internal-holdout-gate-audit.json
            data/candidate-v14-development/manifest.json
