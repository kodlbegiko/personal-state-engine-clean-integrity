name: Candidate v13 external-validity pre-EV-A lock

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/pre-ev-a-lock-trigger.txt

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify EV-A dry-run state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/candidate-v13-external-validity/ev-a-runtime.json').read_text())
          assert r['status']=='MATERIALIZATION_VALIDATED_NO_EXECUTION'
          assert r['case_counts']['total']==384
          c=json.loads(Path('results/candidate-v13-external-validity/runtime-contract.json').read_text())
          assert c['candidate_v13_external_performance_observed'] is False
          PY
      - name: Generate pre-EV-A lock
        run: python scripts/candidate_v13_external_pre_ev_a_lock.py
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/candidate-v13-external-validity/pre-ev-a-lock.json
          git commit -m "candidate-v13 external validity: lock infrastructure before EV-A execution"
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
