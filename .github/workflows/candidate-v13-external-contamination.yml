name: Candidate v13 external-validity contamination firewall

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/contamination-trigger.txt

permissions:
  contents: write

jobs:
  contamination:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pre-performance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/candidate-v13-external-validity/runtime-contract.json').read_text())
          assert r['candidate_v13_external_performance_observed'] is False
          assert r['external_corpus_loaded'] is False
          PY
      - name: Compile contamination audit
        run: |
          python -m py_compile scripts/candidate_v13_external_joint_feasibility.py
          python -m py_compile scripts/candidate_v13_external_contamination_audit.py
      - name: Run contamination firewall
        run: python scripts/candidate_v13_external_contamination_audit.py
      - name: Persist aggregate contamination evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f results/candidate-v13-external-validity/contamination-audit.json
          git add results/candidate-v13-external-validity/contamination-audit.json
          git commit -m "candidate-v13 external validity: record contamination firewall" || true
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
      - name: Enforce contamination gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/candidate-v13-external-validity/contamination-audit.json').read_text())
          assert r['candidate_v13_invoked'] is False
          assert r['formal_case_materialized'] is False
          assert r['status']=='PASS_NO_MATERIAL_CONTAMINATION', r
          assert r['material_contaminated_base_count']==0, r
          PY
