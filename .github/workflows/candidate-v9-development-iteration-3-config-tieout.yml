name: Candidate v9 development iteration 3 config tieout
on:
  push:
    branches: [research/candidate-v9-fresh-lineage]
    paths: [.github/workflows/candidate-v9-development-iteration-3-config-tieout.yml]
permissions:
  contents: write
jobs:
  tieout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-v9-fresh-lineage, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install, integrity audit, full tests
        run: |
          python -m pip install -e . pytest
          test "$(git rev-parse origin/research/candidate-v8-fresh-lineage)" = "86c440fc487c46a1e603144177e666d32a52e725"
          test -z "$(git diff --name-only 86c440fc487c46a1e603144177e666d32a52e725 HEAD -- docs/research/candidate-v8 results/candidate-v8 src/personal_state_engine/candidate_v8.py scripts/generate_candidate_v8_benchmark.py scripts/evaluate_candidate_v8.py 'experiments/benchmarks/candidate-v8-*' experiments/configs/candidate-v8-v1.json)"
          python -m pytest -q | tee /tmp/candidate-v9-tests-iter3.txt
          test "$(sha256sum experiments/benchmarks/candidate-v9-development-v1.json | awk '{print $1}')" = "a398b718bd961482e7817b65f38e784ff43f5849301291ffd985485a921fd704"
      - name: Reproduce development after config alignment
        run: python scripts/evaluate_candidate_v9.py experiments/benchmarks/candidate-v9-development-v1.json results/candidate-v9/development-summary-iteration-3.json --stage development --no-fail
      - name: Append ledger and enforce
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('.'); r=json.load(open(root/'results/candidate-v9/development-summary-iteration-3.json')); tests=Path('/tmp/candidate-v9-tests-iter3.txt').read_text().strip()
          def sha(p): return hashlib.sha256((root/p).read_bytes()).hexdigest()
          row={'iteration':3,'architecture':'TYPED_QUERY_INTENT_PLUS_RELATION_CANONICALIZATION_PLUS_RELATION_RANGE_VALUE_BINDING_PLUS_HARD_SAFETY_BLOCKERS','source_sha256':sha('src/personal_state_engine/candidate_v9.py'),'generator_sha256':sha('scripts/generate_candidate_v9_benchmark.py'),'evaluator_sha256':sha('scripts/evaluate_candidate_v9.py'),'config_sha256':sha('experiments/configs/candidate-v9-v1.json'),'development_benchmark_sha256':sha('experiments/benchmarks/candidate-v9-development-v1.json'),'metrics':r['candidate_v9'],'paired_bootstrap':r['paired_bootstrap'],'checks':r['checks'],'verdict':r['verdict'],'reason':'descriptive config aligned with already-passing iteration-2 implementation; semantic source and benchmark unchanged','patch':'config-only architecture identity tie-out; no inference behavior change','tests':tests,'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'monetary_cost_usd':0}
          p=root/'results/candidate-v9/development-ledger.jsonl'; p.write_text(p.read_text()+json.dumps(row)+'\n')
          (root/'results/candidate-v9/development-test-record-iteration-3.json').write_text(json.dumps({'tests':tests,'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'monetary_cost_usd':0},indent=2)+'\n')
          PY
          git config user.name candidate-v9-research-bot
          git config user.email candidate-v9-research-bot@users.noreply.github.com
          git add results/candidate-v9/development-summary-iteration-3.json results/candidate-v9/development-ledger.jsonl results/candidate-v9/development-test-record-iteration-3.json
          git commit -m "candidate-v9: record development iteration 3 config tieout"
          git push origin HEAD:research/candidate-v9-fresh-lineage
          python - <<'PY'
          import json
          r=json.load(open('results/candidate-v9/development-summary-iteration-3.json'))
          print(json.dumps({'metrics':r['candidate_v9'],'bootstrap':r['paired_bootstrap'],'checks':r['checks'],'verdict':r['verdict']},indent=2))
          raise SystemExit(0 if r['verdict']=='PASS' else 2)
          PY
