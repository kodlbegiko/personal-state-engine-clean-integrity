name: Candidate v9 historical diagnostic

on:
  push:
    branches:
      - research/candidate-v9-fresh-lineage
    paths:
      - .github/workflows/candidate-v9-historical-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Candidate-v9
        uses: actions/checkout@v4
        with:
          ref: research/candidate-v9-fresh-lineage
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e .

      - name: Diagnose frozen Candidate-v8 protected failures
        run: python scripts/diagnose_candidate_v8_for_v9.py

      - name: Commit diagnostic evidence
        run: |
          git config user.name candidate-v9-research-bot
          git config user.email candidate-v9-research-bot@users.noreply.github.com
          git add \
            docs/research/candidate-v9/candidate-v8-protected-failure-taxonomy.md \
            results/candidate-v9/historical-diagnostic-access-v1.json \
            results/candidate-v9/candidate-v8-protected-failure-taxonomy-v1.json
          git commit -m "candidate-v9: record historical protected failure taxonomy"
          git push origin HEAD:research/candidate-v9-fresh-lineage
