name: candidate-v8-recovery-mission
on:
  push:
    branches: [research/candidate-v8-fresh-lineage]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-v8-recovery-mission
  cancel-in-progress: false
jobs:
  run-mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-v8-fresh-lineage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Execute Candidate-v8 frozen mission
        run: python scripts/run_candidate_v8_mission_v2.py
