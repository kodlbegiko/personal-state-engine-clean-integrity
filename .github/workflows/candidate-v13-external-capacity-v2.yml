name: Candidate v13 external-validity calibrated capacity audit v2

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/capacity-v2-trigger.txt

permissions:
  contents: write

concurrency:
  group: candidate-v13-external-capacity-v2
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify calibrated pre-performance locks
        run: |
          test -f docs/research/candidate-v13-external-validity/preregistration.md
          test -f docs/research/candidate-v13-external-validity/source-activation-v2.json
          test -f docs/research/candidate-v13-external-validity/adapter-policy.json
          test -f docs/research/candidate-v13-external-validity/allocation-policy.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              'docs/research/candidate-v13-external-validity/source-activation-v2.json',
              'docs/research/candidate-v13-external-validity/adapter-policy.json',
              'docs/research/candidate-v13-external-validity/allocation-policy.json',
          ]:
              obj=json.loads(Path(p).read_text())
              assert obj['candidate_v13_external_performance_observed'] is False
              assert obj.get('formal_case_materialized', False) is False
          PY
      - name: Compile calibrated capacity audit
        run: python -m py_compile scripts/candidate_v13_external_capacity_audit_v2.py
      - name: Run calibrated capacity audit
        run: python scripts/candidate_v13_external_capacity_audit_v2.py
      - name: Verify no Candidate-v13 execution or formal materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/candidate-v13-external-validity/capacity-audit-v2.json')
          r=json.loads(p.read_text())
          assert r['candidate_v13_invoked'] is False
          assert r['formal_case_materialized'] is False
          assert r['individual_formal_ids_persisted'] is False
          assert r['guard']['pass'] is True
          assert r['status'] in {'PASS_SIMPLE_CAPACITY','CAPACITY_SHORTFALL'}, r
          PY
      - name: Commit aggregate capacity evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v13-external-validity/capacity-audit-v2.json
          git commit -m "candidate-v13 external validity: record calibrated capacity audit v2"
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
