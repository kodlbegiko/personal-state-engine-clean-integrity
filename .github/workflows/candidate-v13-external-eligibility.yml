name: Candidate v13 external-validity eligibility audit

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/eligibility-trigger.txt

permissions:
  contents: write

concurrency:
  group: candidate-v13-external-eligibility
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pre-performance locks
        run: |
          test -f docs/research/candidate-v13-external-validity/preregistration.md
          test -f docs/research/candidate-v13-external-validity/preregistration-lock.json
          test -f docs/research/candidate-v13-external-validity/source-manifest.json
          test -f docs/research/candidate-v13-external-validity/adapter-policy.json
          test -f docs/research/candidate-v13-external-validity/allocation-policy.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('docs/research/candidate-v13-external-validity/adapter-policy.json').read_text())
          q = json.loads(Path('docs/research/candidate-v13-external-validity/allocation-policy.json').read_text())
          assert a['candidate_v13_external_performance_observed'] is False
          assert a['formal_case_materialized'] is False
          assert q['candidate_v13_external_performance_observed'] is False
          PY
      - name: Run eligibility audit
        run: python scripts/candidate_v13_external_eligibility_audit.py
      - name: Verify no Candidate-v13 execution or formal materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('results/candidate-v13-external-validity/eligibility-audit.json').read_text())
          assert r['candidate_v13_invoked'] is False
          assert r['formal_case_materialized'] is False
          assert r['guard']['pass'] is True
          assert r['status'] in {'PASS_BASIC_CAPACITY', 'CAPACITY_SHORTFALL'}, r
          PY
      - name: Commit eligibility evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v13-external-validity/eligibility-audit.json
          git commit -m "candidate-v13 external validity: record pre-performance eligibility audit"
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
