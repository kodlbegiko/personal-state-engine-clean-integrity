name: Candidate v13 Development-to-formal freeze

on:
  push:
    branches:
      - research/candidate-v13-fresh-lineage
    paths:
      - .github/workflows/candidate-v13-freeze.yml

permissions:
  contents: write

concurrency:
  group: candidate-v13-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-fresh-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Candidate-v12 historical regression and Candidate-v13 tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_candidate_v12.py tests/test_candidate_v13.py
      - name: Verify preregistered generator specification without formal materialization
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from candidate_v13_benchmark import STAGES
          assert len({cfg['seed'] for cfg in STAGES.values()}) == 4
          assert len({cfg['prefix'] for cfg in STAGES.values()}) == 4
          grammar = [set(cfg['grammar']) for cfg in STAGES.values()]
          discourse = [set(cfg['discourse']) for cfg in STAGES.values()]
          for i in range(4):
              for j in range(i + 1, 4):
                  assert not (grammar[i] & grammar[j])
                  assert not (discourse[i] & discourse[j])
          assert STAGES['development']['total'] == 900
          assert STAGES['protected']['total'] == 720
          assert STAGES['confirmatory']['total'] == 720
          assert STAGES['final']['total'] == 900
          for stage in ('protected','confirmatory','final'):
              assert not Path(f'experiments/benchmarks/candidate-v13-{stage}-v1.json').exists()
          PY
      - name: Build immutable freeze manifest and initial ledger
        env:
          PYTHONPATH: src
        run: python scripts/freeze_candidate_v13.py
      - name: Persist freeze boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/candidate-v13/freeze-manifest.json
          git add results/candidate-v13/formal-ledger.json
          git commit -m "candidate-v13: freeze after Development PASS [skip ci]"
          git push origin HEAD:research/candidate-v13-fresh-lineage
