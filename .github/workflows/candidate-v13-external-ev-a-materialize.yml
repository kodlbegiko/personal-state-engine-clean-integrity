name: Candidate v13 external-validity EV-A materialization dry run

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/ev-a-materialize-trigger.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pre-execution gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('results/candidate-v13-external-validity/joint-feasibility.json').read_text())
          c=json.loads(Path('results/candidate-v13-external-validity/contamination-audit.json').read_text())
          r=json.loads(Path('results/candidate-v13-external-validity/runtime-contract.json').read_text())
          assert f['status']=='JOINT_FEASIBILITY_PASS'
          assert c['status']=='PASS_NO_MATERIAL_CONTAMINATION'
          assert r['status']=='PASS' and r['candidate_v13_external_performance_observed'] is False
          PY
      - name: Compile evaluator
        run: |
          python -m py_compile scripts/candidate_v13_external_joint_feasibility.py
          python -m py_compile scripts/candidate_v13_external_runtime_eval.py
      - name: Materialize EV-A without Candidate execution
        run: python scripts/candidate_v13_external_runtime_eval.py --stage ev_a --materialize-only
      - name: Validate EV-A dry run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/candidate-v13-external-validity/ev-a-runtime.json')
          r=json.loads(p.read_text())
          assert r['status']=='MATERIALIZATION_VALIDATED_NO_EXECUTION'
          assert r['case_counts']['total']==384
          assert r['case_counts']['answerable']==240
          assert r['case_counts']['no_evidence']==144
          assert set(r['case_counts']['domain'].values())=={48}
          assert set(r['case_counts']['family'].values())=={32}
          expected={'personamem-v2':96,'locomo':77,'sgd-carryover':96,'longmemeval-cleaned':38,'evermembench-dynamic':77}
          assert r['case_counts']['source']==expected, r['case_counts']['source']
          assert r['raw_case_payload_persisted'] is False
          PY
      - name: Persist aggregate materialization evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v13-external-validity/ev-a-runtime.json
          git commit -m "candidate-v13 external validity: validate EV-A materialization without execution"
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
