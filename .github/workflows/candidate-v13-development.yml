name: Candidate v13 development validation

on:
  push:
    branches:
      - research/candidate-v13-fresh-lineage
    paths:
      - src/personal_state_engine/candidate_v13.py
      - tests/test_candidate_v13.py
      - scripts/candidate_v13_benchmark.py
      - scripts/evaluate_candidate_v13.py
      - .github/workflows/candidate-v13-development.yml

permissions:
  contents: write

concurrency:
  group: candidate-v13-development
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-fresh-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify preregistration lock and formal non-materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('docs/research/candidate-v13/preregistration-lock.json').read_text())
          assert lock['status'] == 'PREREGISTRATION_LOCKED'
          assert lock['formal_execution_ledger'] == {'protected': 0, 'confirmatory': 0, 'final': 0}
          for stage in ('protected','confirmatory','final'):
              assert not Path(f'experiments/benchmarks/candidate-v13-{stage}-v1.json').exists()
          PY
      - name: Run Candidate-v13 unit and integrity tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_candidate_v13.py
      - name: Materialize preregistered Development only
        env:
          PYTHONPATH: src
        run: python scripts/candidate_v13_benchmark.py --stage development
      - name: Evaluate Candidate-v13 Development
        env:
          PYTHONPATH: src
        run: python scripts/evaluate_candidate_v13.py --stage development
      - name: Persist Development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/benchmarks/candidate-v13-development-v1.json
          git add results/candidate-v13/development-summary-v1.json
          git commit -m "candidate-v13: record Development evidence [skip ci]"
          git push origin HEAD:research/candidate-v13-fresh-lineage
