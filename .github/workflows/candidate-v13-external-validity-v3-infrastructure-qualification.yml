name: Candidate v13 External Validity v3 — Infrastructure Qualification

on:
  push:
    branches:
      - research/candidate-v13-external-validity-infra-v3
    paths:
      - 'scripts/candidate_v13_external_validity_v3_core.py'
      - 'scripts/candidate_v13_external_validity_v3_evaluator.py'
      - 'scripts/candidate_v13_external_validity_v3_infrastructure_qualification.py'
      - 'docs/research/candidate-v13-external-validity-v3/runtime-memory-policy-v3.json'
      - '.github/workflows/candidate-v13-external-validity-v3-infrastructure-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==4.0.0 huggingface_hub==0.34.4
      - name: Run full candidate-blind infrastructure qualification
        id: qualify
        shell: bash
        run: |
          set +e
          python scripts/candidate_v13_external_validity_v3_infrastructure_qualification.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist v3 aggregate evidence and preregistration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/docs" "$tmpdir/results"
          cp -a docs/research/candidate-v13-external-validity-v3/. "$tmpdir/docs/"
          cp -a results/candidate-v13-external-validity-v3/. "$tmpdir/results/"
          git fetch origin research/candidate-v13-external-validity-infra-v3
          git reset --hard origin/research/candidate-v13-external-validity-infra-v3
          mkdir -p docs/research/candidate-v13-external-validity-v3 results/candidate-v13-external-validity-v3
          cp -a "$tmpdir/docs"/. docs/research/candidate-v13-external-validity-v3/
          cp -a "$tmpdir/results"/. results/candidate-v13-external-validity-v3/
          git add docs/research/candidate-v13-external-validity-v3/ results/candidate-v13-external-validity-v3/
          if ! git diff --cached --quiet; then
            git commit -m "candidate-v13 external validity v3: persist full infrastructure qualification [skip ci]"
            git push origin HEAD:research/candidate-v13-external-validity-infra-v3
          fi
      - name: Enforce qualification exit status
        run: test "${{ steps.qualify.outputs.exit_code }}" = "0"
