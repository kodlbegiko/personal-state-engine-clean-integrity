name: Candidate v12 development validation

on:
  push:
    branches:
      - research/candidate-v12-fresh-lineage
    paths:
      - src/personal_state_engine/candidate_v12.py
      - tests/test_candidate_v12.py
      - scripts/generate_candidate_v12_development.py
      - scripts/evaluate_candidate_v12_development.py
      - .github/workflows/candidate-v12-development.yml

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v12-fresh-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Candidate-v12 unit and historical regression tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_candidate_v12.py
      - name: Generate preregistered fresh Development surface if generator exists
        env:
          PYTHONPATH: src
        run: |
          if [ -f scripts/generate_candidate_v12_development.py ]; then
            python scripts/generate_candidate_v12_development.py
          fi
      - name: Run Development architecture comparison if evaluator exists
        env:
          PYTHONPATH: src
        run: |
          if [ -f scripts/evaluate_candidate_v12_development.py ]; then
            python scripts/evaluate_candidate_v12_development.py
          fi
      - name: Persist Development-only generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            experiments/benchmarks/candidate-v12-development-v1.json
            results/candidate-v12/architecture-comparison-development-v1.json
            results/candidate-v12/development-summary-v1.json
          )
          changed=0
          for p in "${paths[@]}"; do
            if [ -n "$(git status --porcelain -- "$p")" ]; then
              git add "$p"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "No Development artifact changes"
            exit 0
          fi
          git commit -m "candidate-v12: record fresh Development evidence [skip ci]"
          git push origin HEAD:research/candidate-v12-fresh-lineage
