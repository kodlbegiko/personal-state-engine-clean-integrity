name: Candidate-v10 Historical Diagnostic

on:
  push:
    branches:
      - research/candidate-v10-fresh-lineage
    paths:
      - scripts/diagnose_candidate_v9_confirmatory_for_v10.py
      - .github/workflows/candidate-v10-historical-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v10-fresh-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run historical diagnostic
        run: python scripts/diagnose_candidate_v9_confirmatory_for_v10.py
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v10/candidate-v9-confirmatory-failure-taxonomy-v1.json docs/research/candidate-v10/candidate-v9-confirmatory-failure-taxonomy.md
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "candidate-v10: record historical v9 failure taxonomy"
            git push origin HEAD:research/candidate-v10-fresh-lineage
          fi
