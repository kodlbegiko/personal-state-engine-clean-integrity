name: Candidate v9 development iteration 2
on:
  push:
    branches: [research/candidate-v9-fresh-lineage]
    paths: [.github/workflows/candidate-v9-development-iteration-2.yml]
permissions:
  contents: write
jobs:
  iterate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-v9-fresh-lineage, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Implement relation-range value binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/personal_state_engine/candidate_v9.py')
          s=p.read_text()
          old='''    shared_types = qtypes & ctypes\n    if shared_types:\n        return True, shared_types\n\n    # If evidence explicitly identifies another semantic type, do not infer\n    # compatibility merely from lexical proximity.\n    if ctypes and not shared_types:\n        return False, ctypes\n\n    relation_evidence = set(relation_evidence or ())\n    for relation in relation_evidence:\n        allowed = RELATION_TO_VALUE_TYPES.get(relation, set())\n        if relation != \"health_medication\" and len(allowed) == 1 and allowed <= qtypes:\n            return True, {f\"inferred:{next(iter(allowed))}\"}\n\n    # Preference is deliberately polymorphic.  Permit an open-class value only\n    # when the clause exposes no contradictory typed signal; safety blockers,\n    # subject matching, relation matching, value-bearing, and temporal checks\n    # are still mandatory.\n    if \"preference\" in relation_evidence and len(qtypes) == 1 and not ctypes:\n        return True, {f\"open:{next(iter(qtypes))}\"}\n\n    return False, ctypes\n'''
          new='''    shared_types = qtypes & ctypes\n    if shared_types:\n        return True, shared_types\n\n    relation_evidence = set(relation_evidence or ())\n\n    # A monomorphic canonical relation defines the semantic range of its\n    # argument more reliably than incidental words elsewhere in the clause.\n    # Example: \"preparing for a cycling brevet\" is still a GOAL claim even\n    # though the value phrase contains an activity word.  Medication is kept\n    # out of this shortcut because generic take/taking is intentionally broad.\n    for relation in relation_evidence:\n        allowed = RELATION_TO_VALUE_TYPES.get(relation, set())\n        if relation != \"health_medication\" and len(allowed) == 1 and allowed <= qtypes:\n            return True, {f\"range:{next(iter(allowed))}\"}\n\n    # Clause-level detectors can observe temporal/location adjuncts that are\n    # not the answer value (e.g. \"during afternoon breaks\").  They do not\n    # constitute a content-type contradiction for a polymorphic relation.\n    content_types = ctypes - {\"schedule\", \"location\", \"status\"}\n    if content_types and not (qtypes & content_types):\n        return False, content_types\n\n    # Preference is deliberately polymorphic.  If no competing content type\n    # is identified, retain the query's requested type as an open-class range.\n    # Hard blockers, subject, relation, value-bearing and temporal checks still\n    # have to pass independently.\n    if \"preference\" in relation_evidence and len(qtypes) == 1 and not content_types:\n        return True, {f\"open:{next(iter(qtypes))}\"}\n\n    return False, content_types or ctypes\n'''
          assert old in s
          p.write_text(s.replace(old,new))

          t=Path('tests/test_candidate_v9.py'); ts=t.read_text()
          addition='''\n\ndef test_goal_relation_range_overrides_incidental_activity_word():\n    c=case(\"What target is Noor preparing toward?\",[m(\"rel\",\"Noor is preparing for a cycling brevet.\")])\n    assert pse_candidate_v9_rank(c,5)==[\"rel\"]\n\n\ndef test_goal_relation_range_overrides_incidental_course_word():\n    c=case(\"What target is Noor preparing toward?\",[m(\"rel\",\"Noor is preparing for a wilderness course.\")])\n    assert pse_candidate_v9_rank(c,5)==[\"rel\"]\n\n\ndef test_preference_ignores_temporal_adjunct_as_value_type():\n    c=case(\"Which beverage does Noor favor on workdays?\",[m(\"rel\",\"Noor routinely selects saffron tonic during afternoon breaks.\")])\n    assert pse_candidate_v9_rank(c,5)==[\"rel\"]\n\n\ndef test_medication_query_does_not_accept_course_taking():\n    c=case(\"Which medication does Noor take?\",[m(\"x\",\"Noor is taking comparative hydrology this term.\")])\n    assert pse_candidate_v9_rank(c,5)==[]\n'''
          if 'test_goal_relation_range_overrides_incidental_activity_word' not in ts:
              t.write_text(ts+addition)
          PY
          git config user.name candidate-v9-research-bot
          git config user.email candidate-v9-research-bot@users.noreply.github.com
          git add src/personal_state_engine/candidate_v9.py tests/test_candidate_v9.py
          git commit -m "candidate-v9: bind value type to canonical relation range"
          git push origin HEAD:research/candidate-v9-fresh-lineage

      - name: Install, integrity audit, full tests
        run: |
          python -m pip install -e . pytest
          test "$(git rev-parse origin/research/candidate-v8-fresh-lineage)" = "86c440fc487c46a1e603144177e666d32a52e725"
          test -z "$(git diff --name-only 86c440fc487c46a1e603144177e666d32a52e725 HEAD -- docs/research/candidate-v8 results/candidate-v8 src/personal_state_engine/candidate_v8.py scripts/generate_candidate_v8_benchmark.py scripts/evaluate_candidate_v8.py 'experiments/benchmarks/candidate-v8-*' experiments/configs/candidate-v8-v1.json)"
          python -m pytest -q | tee /tmp/candidate-v9-tests-iter2.txt
          test "$(sha256sum experiments/benchmarks/candidate-v9-development-v1.json | awk '{print $1}')" = "a398b718bd961482e7817b65f38e784ff43f5849301291ffd985485a921fd704"

      - name: Evaluate unchanged development surface
        run: python scripts/evaluate_candidate_v9.py experiments/benchmarks/candidate-v9-development-v1.json results/candidate-v9/development-summary-iteration-2.json --stage development --no-fail

      - name: Append development ledger
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('.'); r=json.load(open(root/'results/candidate-v9/development-summary-iteration-2.json')); tests=Path('/tmp/candidate-v9-tests-iter2.txt').read_text().strip()
          def sha(p): return hashlib.sha256((root/p).read_bytes()).hexdigest()
          row={'iteration':2,'architecture':'TYPED_QUERY_INTENT_PLUS_RELATION_CANONICALIZATION_PLUS_RELATION_RANGE_VALUE_BINDING_PLUS_HARD_SAFETY_BLOCKERS','source_sha256':sha('src/personal_state_engine/candidate_v9.py'),'generator_sha256':sha('scripts/generate_candidate_v9_benchmark.py'),'evaluator_sha256':sha('scripts/evaluate_candidate_v9.py'),'config_sha256':sha('experiments/configs/candidate-v9-v1.json'),'development_benchmark_sha256':sha('experiments/benchmarks/candidate-v9-development-v1.json'),'metrics':r['candidate_v9'],'paired_bootstrap':r['paired_bootstrap'],'checks':r['checks'],'verdict':r['verdict'],'failure_taxonomy_basis':'iteration-1: 3/3 VALUE_TYPE caused by clause-level incidental type signals','reason':'bind open-class value type to canonical relation range; treat schedule/location/status as adjunct types for polymorphic preference','patch':'monomorphic relation range precedes incidental lexical type; explicit content conflicts remain fail-closed; health_medication excluded from structural shortcut','tests':tests,'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'monetary_cost_usd':0}
          p=root/'results/candidate-v9/development-ledger.jsonl'; p.write_text(p.read_text()+json.dumps(row)+'\n')
          (root/'results/candidate-v9/development-test-record-iteration-2.json').write_text(json.dumps({'tests':tests,'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'monetary_cost_usd':0},indent=2)+'\n')
          PY
          git add results/candidate-v9/development-summary-iteration-2.json results/candidate-v9/development-ledger.jsonl results/candidate-v9/development-test-record-iteration-2.json
          git commit -m "candidate-v9: record development iteration 2"
          git push origin HEAD:research/candidate-v9-fresh-lineage

      - name: Enforce preregistered gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open('results/candidate-v9/development-summary-iteration-2.json'))
          print(json.dumps({'metrics':r['candidate_v9'],'bootstrap':r['paired_bootstrap'],'checks':r['checks'],'verdict':r['verdict']},indent=2))
          raise SystemExit(0 if r['verdict']=='PASS' else 2)
          PY
