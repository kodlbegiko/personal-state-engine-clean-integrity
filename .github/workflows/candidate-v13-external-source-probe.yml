name: Candidate v13 external-validity source probe

on:
  push:
    branches:
      - research/candidate-v13-naturalistic-external-validity
    paths:
      - docs/research/candidate-v13-external-validity/source-probe-trigger.txt

permissions:
  contents: write

concurrency:
  group: candidate-v13-external-source-probe
  cancel-in-progress: false

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v13-naturalistic-external-validity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preregistration precedes source probing
        run: |
          test -f docs/research/candidate-v13-external-validity/preregistration.md
          test -f docs/research/candidate-v13-external-validity/preregistration-lock.json
          test -f docs/research/candidate-v13-external-validity/source-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('docs/research/candidate-v13-external-validity/preregistration-lock.json').read_text())
          assert lock['status'] == 'LOCKED_BEFORE_EXTERNAL_SOURCE_DISCOVERY'
          assert lock['external_source_discovery_started_before_preregistration_commit'] is False
          assert lock['external_case_materialization_started_before_preregistration_commit'] is False
          assert lock['candidate_v13_external_performance_observed_before_preregistration_commit'] is False
          PY
      - name: Run pre-performance source probe
        run: python scripts/candidate_v13_external_source_probe.py
      - name: Run PerLTQA reference integrity probe
        run: python scripts/candidate_v13_external_perltqa_mapping_probe.py
      - name: Run PerLTQA Memory Anchors probe
        run: python scripts/candidate_v13_external_perltqa_anchor_probe.py
      - name: Run LoCoMo evidence-ID probe
        run: python scripts/candidate_v13_external_locomo_probe.py
      - name: Run SGD carry-over probe
        run: python scripts/candidate_v13_external_sgd_carryover_probe.py
      - name: Verify probes did not execute Candidate-v13 or materialize formal cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = {
              'source': 'results/candidate-v13-external-validity/source-probe.json',
              'mapping': 'results/candidate-v13-external-validity/perltqa-mapping-probe.json',
              'anchor': 'results/candidate-v13-external-validity/perltqa-anchor-probe.json',
              'locomo': 'results/candidate-v13-external-validity/locomo-probe.json',
              'sgd': 'results/candidate-v13-external-validity/sgd-carryover-probe.json',
          }
          r = {k: json.loads(Path(v).read_text()) for k, v in paths.items()}
          assert r['source']['status'] == 'PASS', r['source']
          assert r['source']['candidate_import_guard']['pass'] is True
          for name, value in r.items():
              assert value['candidate_v13_invoked'] is False, name
              assert value['formal_case_materialized'] is False, name
          assert r['mapping']['versions']['en_v2']['canonical_qa_records'] == 8593
          assert r['mapping']['versions']['en_v1']['canonical_qa_records'] == 8593
          assert r['anchor']['aggregate_counts']['canonical_qa_records'] == 8593
          assert r['locomo']['aggregate_counts']['samples'] == 10
          assert r['sgd']['aggregate_counts']['dialogues'] > 0
          PY
      - name: Commit pre-performance source evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/candidate-v13-external-validity/source-probe.json \
            results/candidate-v13-external-validity/perltqa-mapping-probe.json \
            results/candidate-v13-external-validity/perltqa-anchor-probe.json \
            results/candidate-v13-external-validity/locomo-probe.json \
            results/candidate-v13-external-validity/sgd-carryover-probe.json
          git commit -m "candidate-v13 external validity: record pre-performance source probes"
          git push origin HEAD:research/candidate-v13-naturalistic-external-validity
