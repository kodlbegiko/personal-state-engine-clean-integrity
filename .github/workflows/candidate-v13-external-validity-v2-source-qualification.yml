name: Candidate v13 External Validity v2 — Source Qualification

on:
  push:
    branches:
      - research/candidate-v13-external-validity-infra-v2
    paths:
      - 'scripts/candidate_v13_external_validity_v2_source_qualification.py'
      - 'scripts/candidate_v13_external_validity_v2_source_qualification_runner.py'
      - 'docs/research/candidate-v13-external-validity-v2/source-contract-v2.json'
      - '.github/workflows/candidate-v13-external-validity-v2-source-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==4.0.0 huggingface_hub==0.34.4

      - name: Run candidate-blind source qualification
        id: qualify
        shell: bash
        run: |
          set +e
          python scripts/candidate_v13_external_validity_v2_source_qualification_runner.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist aggregate qualification evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          cp -a results/candidate-v13-external-validity-v2/. "$tmpdir/"
          git fetch origin research/candidate-v13-external-validity-infra-v2
          git reset --hard origin/research/candidate-v13-external-validity-infra-v2
          mkdir -p results/candidate-v13-external-validity-v2
          cp -a "$tmpdir"/. results/candidate-v13-external-validity-v2/
          git add results/candidate-v13-external-validity-v2/
          if ! git diff --cached --quiet; then
            git commit -m "candidate-v13 external validity v2: persist source qualification evidence [skip ci]"
            git push origin HEAD:research/candidate-v13-external-validity-infra-v2
          fi

      - name: Enforce qualification exit status
        shell: bash
        run: |
          test "${{ steps.qualify.outputs.exit_code }}" = "0"
