name: Candidate v13 External Validity v3 — Formal Sequence

on:
  push:
    branches:
      - research/candidate-v13-external-validity-infra-v3
    paths:
      - 'docs/research/candidate-v13-external-validity-v3/formal-authorization-lock-v3.json'

permissions:
  contents: write

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-source runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==4.0.0 huggingface_hub==0.34.4
      - name: Configure formal evidence committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Execute authorized one-shot EV-A → EV-B → EV-C sequence
        id: formal
        shell: bash
        run: |
          set +e
          PYTHONPATH="$PWD/src" python scripts/candidate_v13_external_validity_v3_formal_sequence.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce scientific terminal semantics
        shell: bash
        run: |
          code="${{ steps.formal.outputs.exit_code }}"
          if [ "$code" = "0" ] || [ "$code" = "2" ] || [ "$code" = "4" ]; then
            exit 0
          fi
          exit "$code"
