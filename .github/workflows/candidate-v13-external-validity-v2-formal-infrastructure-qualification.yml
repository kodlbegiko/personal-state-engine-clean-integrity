name: Candidate v13 External Validity v2 — Formal Infrastructure Qualification

on:
  push:
    branches:
      - research/candidate-v13-external-validity-infra-v2
    paths:
      - 'scripts/candidate_v13_external_validity_v2_source_qualification.py'
      - 'scripts/candidate_v13_external_validity_v2_source_qualification_runner.py'
      - 'scripts/candidate_v13_external_validity_v2_allocation_feasibility.py'
      - 'scripts/candidate_v13_external_validity_v2_allocation_runtime.py'
      - 'scripts/candidate_v13_external_validity_v2_formal_materializer.py'
      - 'scripts/candidate_v13_external_validity_v2_evaluator.py'
      - 'scripts/candidate_v13_external_validity_v2_formal_runner.py'
      - 'scripts/candidate_v13_external_validity_v2_formal_sequence.py'
      - 'scripts/candidate_v13_external_validity_v2_formal_infrastructure_qualification.py'
      - 'docs/research/candidate-v13-external-validity-v2/source-contract-v2.json'
      - 'docs/research/candidate-v13-external-validity-v2/allocation-policy-v2.json'
      - 'docs/research/candidate-v13-external-validity-v2/evaluation-policy-v2.json'
      - 'docs/research/candidate-v13-external-validity-v2/materializer-contract-v2.json'
      - '.github/workflows/candidate-v13-external-validity-v2-formal-infrastructure-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formal infrastructure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install datasets==4.0.0 huggingface_hub==0.34.4

      - name: Run candidate-blind formal infrastructure qualification
        id: qualify
        shell: bash
        run: |
          set +e
          python scripts/candidate_v13_external_validity_v2_formal_infrastructure_qualification.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist aggregate formal infrastructure evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          result="results/candidate-v13-external-validity-v2/formal-infrastructure-qualification.json"
          if [ -f "$result" ]; then
            tmpdir="$(mktemp -d)"
            cp "$result" "$tmpdir/result.json"
            git fetch origin research/candidate-v13-external-validity-infra-v2
            git reset --hard origin/research/candidate-v13-external-validity-infra-v2
            mkdir -p results/candidate-v13-external-validity-v2
            cp "$tmpdir/result.json" "$result"
            git add "$result"
            if ! git diff --cached --quiet; then
              git commit -m "candidate-v13 external validity v2: persist formal infrastructure qualification evidence [skip ci]"
              git push origin HEAD:research/candidate-v13-external-validity-infra-v2
            fi
          else
            echo "qualification result absent; enforcement step will fail closed"
          fi

      - name: Enforce fail-closed formal infrastructure status
        shell: bash
        run: |
          test "${{ steps.qualify.outputs.exit_code }}" = "0"
