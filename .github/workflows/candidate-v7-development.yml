name: Candidate-v7 Development Evidence

on:
  push:
    branches:
      - research/candidate-v7-fresh-evidence
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/run_candidate_v7_development.py'
      - 'experiments/configs/candidate-v7-v1.json'
      - 'pyproject.toml'
      - '.github/workflows/candidate-v7-development.yml'

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v7-fresh-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Generate and evaluate development evidence
        run: python scripts/run_candidate_v7_development.py
      - name: Commit immutable development artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/benchmarks/candidate-v7-development-v1.json
          git add results/candidate-v7/development-ledger.jsonl
          git add results/candidate-v7/development-summary-v1.json
          git add results/candidate-v7/decontamination-report-v1.json
          git add results/candidate-v7/development-snapshots/candidate_v7-iter0.py
          if git diff --cached --quiet; then
            echo "No development artifact changes."
          else
            git commit -m "research: record Candidate-v7 development iteration 1"
            git push origin HEAD:research/candidate-v7-fresh-evidence
          fi
