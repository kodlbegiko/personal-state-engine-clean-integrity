name: Candidate v9 development diagnostic
on:
  push:
    branches: [research/candidate-v9-fresh-lineage]
    paths: [.github/workflows/candidate-v9-development-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-v9-fresh-lineage, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .
      - run: python scripts/diagnose_candidate_v9_development.py
      - run: |
          git config user.name candidate-v9-research-bot
          git config user.email candidate-v9-research-bot@users.noreply.github.com
          git add results/candidate-v9/development-failure-taxonomy-iteration-0.json
          git commit -m "candidate-v9: diagnose development iteration 0 failures"
          git push origin HEAD:research/candidate-v9-fresh-lineage
