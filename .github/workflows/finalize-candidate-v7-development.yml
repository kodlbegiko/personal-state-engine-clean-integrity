name: Finalize Candidate-v7 Development

on:
  push:
    branches:
      - research/candidate-v7-fresh-evidence
    paths:
      - 'scripts/finalize_candidate_v7_development.py'
      - '.github/workflows/finalize-candidate-v7-development.yml'

permissions:
  contents: write

jobs:
  finalize-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v7-fresh-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run final development and stress evidence
        run: python scripts/finalize_candidate_v7_development.py
      - name: Commit reproducible development artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/benchmarks/candidate-v7-development-stress-v1.json
          git add results/candidate-v7/development-stress-summary-v1.json
          git add results/candidate-v7/development-summary-v1.json
          git add results/candidate-v7/development-ledger.jsonl
          git add results/candidate-v7/decontamination-report-v1.json
          git commit -m "research: record Candidate-v7 pre-freeze development evidence"
          git push origin HEAD:research/candidate-v7-fresh-evidence
