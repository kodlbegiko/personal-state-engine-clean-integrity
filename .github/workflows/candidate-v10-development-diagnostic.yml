name: Candidate-v10 Development Diagnostic

on:
  push:
    branches:
      - research/candidate-v10-fresh-lineage
    paths:
      - scripts/diagnose_candidate_v10_development.py
      - .github/workflows/candidate-v10-development-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-v10-fresh-lineage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/diagnose_candidate_v10_development.py
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate-v10/development-failure-taxonomy-v1.json
          git commit -m "candidate-v10: record development failure taxonomy"
          git push origin HEAD:research/candidate-v10-fresh-lineage
